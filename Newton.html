<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Newton Method</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- TITLE -->
    <h1 class="title">Newton Method</h1>

    <div class="page">
      <!-- LEFT -->
      <div class="container">
        <div class="card inputs">
          <h2>Inputs</h2>

          <input id="fx" placeholder="f(x)" />
          <input id="x0" placeholder="X0" />
          <input id="error" placeholder="error%" />

          <button onclick="solveNewton()">Calculate</button>
        </div>
      </div>

      <div class="card output">
        <h2>Output</h2>
        <p id="waiting">Root will appear here...</p>
        <div id="output-card" class="hidden">
          <table>
            <thead>
              <tr>
                <th>i</th>
                <th>xᵢ</th>
                <th>f(xᵢ)</th>
                <th>f'(xᵢ)</th>
                <th>Ea%</th>
              </tr>
            </thead>
            <tbody id="result"></tbody>
          </table>
        </div>
        <canvas id="graph" width="650" height="350"></canvas>
      </div>
    </div>
    <script src="math.min.js"></script>
    <script src="code.js"></script>
  </body>
</html>
